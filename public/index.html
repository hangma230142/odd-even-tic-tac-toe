<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Odd/Even Tic-Tac-Toe</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js" defer></script>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #f8fafc;
      color: #333;
    }
    h1 {
      margin-top: 20px;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(5, 60px);
      grid-template-rows: repeat(5, 60px);
      gap: 8px;
      margin-top: 20px;
    }
    .cell {
      width: 60px;
      height: 60px;
      background-color: #e2e8f0;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      cursor: pointer;
      transition: 0.2s;
    }
    .cell:hover {
      background-color: #cbd5e1;
    }
    #role {
      margin-top: 10px;
      font-weight: bold;
    }
    #restartBtn {
      margin-top: 15px;
      padding: 8px 14px;
      border: none;
      background-color: #2563eb;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }
    #restartBtn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>
  <h1>Odd/Even Tic-Tac-Toe</h1>
  <p id="role">Waiting for another player...</p>
  <div id="board"></div>
  <button id="restartBtn">Restart Game</button>
</body>
</html>
